<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compromeets - Find Your Perfect Meeting Spot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 3em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .header p {
        font-size: 1.2em;
        opacity: 0.9;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 1.1em;
      }

      .postcode-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .postcode-input-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1em;
        transition: all 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-add {
        background: #48bb78;
        color: white;
      }

      .btn-add:hover {
        background: #38a169;
        transform: translateY(-2px);
      }

      .btn-remove {
        background: #f56565;
        color: white;
        padding: 12px 20px;
      }

      .btn-remove:hover {
        background: #e53e3e;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        width: 100%;
        font-size: 1.2em;
        padding: 16px;
        margin-top: 10px;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .venue-types {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .venue-chip {
        padding: 10px 20px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s;
        background: white;
      }

      .venue-chip:hover {
        border-color: #667eea;
        transform: translateY(-2px);
      }

      .venue-chip input {
        margin-right: 8px;
      }

      .venue-chip.selected {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      .custom-venue-input {
        margin-top: 12px;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1em;
        width: 100%;
        transition: all 0.3s;
      }

      .custom-venue-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .custom-venue-input::placeholder {
        color: #999;
        font-style: italic;
      }

      .toggle-container {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px;
        background: #f7fafc;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 34px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #667eea;
      }

      input:checked + .slider:before {
        transform: translateX(26px);
      }

      .toggle-label {
        font-size: 1.1em;
        font-weight: 600;
        color: #333;
      }

      .toggle-badge {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 4px 12px;
        border-radius: 15px;
        font-size: 0.85em;
        font-weight: 600;
      }

      select {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1em;
        background: white;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
      }

      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .preference-container {
        display: none;
        margin-top: 15px;
        padding: 15px;
        background: #f0f4ff;
        border-radius: 10px;
        border-left: 4px solid #667eea;
      }

      .preference-container.active {
        display: block;
      }

      .preference-info {
        font-size: 0.9em;
        color: #666;
        margin-top: 8px;
        font-style: italic;
      }

      .results {
        margin-top: 30px;
      }

      .method-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
        margin-bottom: 15px;
      }

      .method-algorithm {
        background: #48bb78;
        color: white;
      }

      .method-llm {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .place-location {
        color: #666;
        font-size: 0.95em;
        margin-bottom: 8px;
      }

      .place-why {
        color: #555;
        font-style: italic;
        margin-bottom: 10px;
      }

      .place-link {
        display: inline-block;
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        margin-top: 8px;
      }

      .place-link:hover {
        text-decoration: underline;
      }

      .results-header {
        font-size: 1.5em;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
      }

      .place-card {
        background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 15px;
        border: 2px solid transparent;
        transition: all 0.3s;
      }

      .place-card:hover {
        border-color: #667eea;
        transform: translateX(5px);
      }

      .place-name {
        font-size: 1.3em;
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
      }

      .place-rating {
        display: inline-block;
        background: #fbbf24;
        color: white;
        padding: 4px 12px;
        border-radius: 15px;
        font-weight: 600;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #667eea;
        font-size: 1.2em;
      }

      .error {
        background: #fee;
        border: 2px solid #f56565;
        padding: 15px;
        border-radius: 10px;
        color: #c53030;
        margin-top: 20px;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🗺️ Compromeets</h1>
        <p>Find the perfect meeting spot for everyone</p>
      </div>

      <div class="card">
        <form id="meetingForm">
          <div class="form-group">
            <label>Postcodes</label>
            <div class="postcode-container" id="postcodeContainer">
              <div class="postcode-input-group">
                <input
                  type="text"
                  name="postcode"
                  placeholder="e.g., E14 2DF"
                  required
                />
                <button
                  type="button"
                  class="btn btn-remove"
                  onclick="removePostcode(this)"
                  style="display: none"
                >
                  Remove
                </button>
              </div>
              <div class="postcode-input-group">
                <input
                  type="text"
                  name="postcode"
                  placeholder="e.g., N7 0AA"
                  required
                />
                <button
                  type="button"
                  class="btn btn-remove"
                  onclick="removePostcode(this)"
                >
                  Remove
                </button>
              </div>
            </div>
            <button
              type="button"
              class="btn btn-add"
              onclick="addPostcode()"
              style="margin-top: 10px"
            >
              + Add Another Postcode
            </button>
          </div>

          <div class="form-group">
            <label>Venue Type (select one)</label>
            <div class="venue-types">
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="pub" checked />
                🍺 Pub
              </label>
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="restaurant" />
                🍽️ Restaurant
              </label>
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="cafe" /> ☕ Cafe
              </label>
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="bar" /> 🍸 Bar
              </label>
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="park" /> 🌳 Park
              </label>
              <label class="venue-chip">
                <input type="radio" name="venue_type" value="custom" /> ✏️ Custom
              </label>
            </div>
            <input
              type="text"
              id="customVenueInput"
              class="custom-venue-input"
              placeholder="Enter custom venue type (e.g., 'sports pub', 'jazz club', 'comedy club')"
              style="display: none"
            />
          </div>

          <div class="toggle-container">
            <label class="toggle-switch">
              <input type="checkbox" id="useLlmToggle" />
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Use AI Suggestions</span>
            <span class="toggle-badge">✨ Claude Sonnet 4.5</span>
          </div>

          <div class="preference-container" id="preferenceContainer">
            <div class="form-group" style="margin-bottom: 0">
              <label>Optimization Preference</label>
              <select id="preferenceSelect">
                <option value="equidistance">
                  ⚖️ Equidistance - Fair travel times for everyone
                </option>
                <option value="minimum_overall_travel_time">
                  ⚡ Minimum Travel Time - Most efficient overall
                </option>
                <option value="best_rating">
                  ⭐ Best Rating - Highest quality venues
                </option>
                <option value="affordability">
                  💰 Affordability - Budget-friendly options
                </option>
              </select>
              <div class="preference-info">
                AI will intelligently select venues based on your chosen
                criteria
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            Find Meeting Spots
          </button>
        </form>

        <div id="results"></div>
      </div>
    </div>

    <script>
      // Toggle preference container visibility
      const llmToggle = document.getElementById("useLlmToggle");
      const preferenceContainer = document.getElementById(
        "preferenceContainer"
      );

      llmToggle.addEventListener("change", function () {
        if (this.checked) {
          preferenceContainer.classList.add("active");
        } else {
          preferenceContainer.classList.remove("active");
        }
      });

      // Update venue chip styling on change (for radio buttons)
      document.querySelectorAll(".venue-chip input").forEach((input) => {
        input.addEventListener("change", function () {
          // Remove selected class from all chips
          document.querySelectorAll(".venue-chip").forEach((chip) => {
            chip.classList.remove("selected");
          });
          // Add selected class to checked chip
          if (this.checked) {
            this.parentElement.classList.add("selected");
          }

          // Show/hide custom input based on selection
          const customInput = document.getElementById("customVenueInput");
          if (this.value === "custom") {
            customInput.style.display = "block";
            customInput.focus();
          } else {
            customInput.style.display = "none";
          }
        });
        // Initialize selected state
        if (input.checked) {
          input.parentElement.classList.add("selected");
        }
      });

      function addPostcode() {
        const container = document.getElementById("postcodeContainer");
        const newGroup = document.createElement("div");
        newGroup.className = "postcode-input-group";
        newGroup.innerHTML = `
                <input type="text" name="postcode" placeholder="e.g., SW1A 1AA" required>
                <button type="button" class="btn btn-remove" onclick="removePostcode(this)">Remove</button>
            `;
        container.appendChild(newGroup);
      }

      function removePostcode(button) {
        const container = document.getElementById("postcodeContainer");
        if (container.children.length > 1) {
          button.parentElement.remove();
          // Update visibility of remove buttons
          updateRemoveButtons();
        }
      }

      function updateRemoveButtons() {
        const container = document.getElementById("postcodeContainer");
        const removeButtons = container.querySelectorAll(".btn-remove");
        if (container.children.length === 1) {
          removeButtons[0].style.display = "none";
        } else {
          removeButtons.forEach((btn) => (btn.style.display = "block"));
        }
      }

      document
        .getElementById("meetingForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const submitBtn = document.getElementById("submitBtn");
          const resultsDiv = document.getElementById("results");

          // Get postcodes
          const postcodes = Array.from(
            document.querySelectorAll('input[name="postcode"]')
          )
            .map((input) => input.value.trim())
            .filter((val) => val !== "");

          // Get selected venue type (single selection with radio button)
          const venueTypeRadio = document.querySelector(
            'input[name="venue_type"]:checked'
          );
          let venueType;

          if (venueTypeRadio.value === "custom") {
            venueType = document.getElementById("customVenueInput").value.trim();
            if (!venueType) {
              resultsDiv.innerHTML =
                '<div class="error">Please enter a custom venue type</div>';
              return;
            }
          } else {
            venueType = venueTypeRadio.value;
          }

          // Get LLM settings
          const useLlm = document.getElementById("useLlmToggle").checked;
          const preference = document.getElementById("preferenceSelect").value;

          if (postcodes.length < 2) {
            resultsDiv.innerHTML =
              '<div class="error">Please enter at least 2 postcodes</div>';
            return;
          }

          // Show loading
          submitBtn.disabled = true;
          const loadingMessage = useLlm
            ? "AI is thinking..."
            : "Finding spots...";
          submitBtn.textContent = loadingMessage;
          resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div>${loadingMessage}</div>`;

          try {
            const requestBody = {
              postcodes: postcodes,
              types: [venueType],
              use_llm: useLlm,
            };

            if (useLlm) {
              requestBody.preference = preference;
            }

            const response = await fetch("/suggest", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            });

            if (!response.ok) {
              const errorData = await response.json();
              const detail = errorData.detail;
              const message =
                typeof detail === "string"
                  ? detail
                  : Array.isArray(detail)
                  ? detail.map((e) => `${e.loc?.join(".")}: ${e.msg}`).join("; ")
                  : `HTTP error! status: ${response.status}`;
              throw new Error(message);
            }

            const data = await response.json();

            // Display results
            if (data.places && data.places.length > 0) {
              const methodBadge =
                data.method === "llm"
                  ? '<span class="method-badge method-llm">✨ AI Suggestions</span>'
                  : '<span class="method-badge method-algorithm">🗺️ Algorithm-based</span>';

              let html =
                methodBadge +
                '<div class="results-header">🎯 Perfect Meeting Spots</div>';

              if (data.method === "llm") {
                // LLM format: array of objects with venue_name, location, why, maps
                data.places.forEach((place) => {
                  html += `
                                <div class="place-card">
                                    <div class="place-name">${place.venue_name}</div>
                                    <div class="place-location">📍 ${place.location}</div>
                                    <div class="place-why">${place.why}</div>
                                    <a href="${place.maps}" target="_blank" class="place-link">View on Google Maps →</a>
                                </div>
                            `;
                });
              } else {
                // Algorithm format: array of [name, rating] tuples
                data.places.forEach(([name, rating]) => {
                  html += `
                                <div class="place-card">
                                    <div class="place-name">${name}</div>
                                    <span class="place-rating">⭐ ${rating.toFixed(
                                      1
                                    )}</span>
                                </div>
                            `;
                });
              }

              resultsDiv.innerHTML = html;
            } else {
              resultsDiv.innerHTML =
                '<div class="error">No places found. Try adjusting your search criteria.</div>';
            }
          } catch (error) {
            resultsDiv.innerHTML = `<div class="error">Error: ${error.message}. Please try again.</div>`;
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Find Meeting Spots";
          }
        });

      // Initialize remove button visibility
      updateRemoveButtons();
    </script>
  </body>
</html>
